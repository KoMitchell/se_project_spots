<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A social photo-sharing page where users can add, like, and manage images."
    />
    <meta name="author" content="K.O.Mitchell" />
    <meta
      name="keywords"
      content="photos, gallery, social media, Spots project"
    />

    <link rel="stylesheet" href="pages/index.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

    <title>Spots</title>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        border: 0;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <main class="page__content">
        <header class="header">
          <img src="./images/Logo.svg" alt="Spots logo" class="header__logo" />
        </header>

        <!-- Profile section -->
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="User avatar"
            class="profile__avatar"
          />

          <div class="profile__info">
            <h1 class="profile__name">Bessie (Elizabeth) Coleman</h1>

            <p class="profile__description">
              Early American civil aviator. First African-American woman and
              first Native American to hold a pilot license.
            </p>

            <button type="button" class="profile__edit-profile-button">
              <img src="./images/button-secondary.svg" alt="" />
              <span class="visually-hidden">Edit profile</span>
            </button>
          </div>

          <button type="button" class="profile__new-post-button">
            <img src="./images/plus-sign.svg" alt="" />
            New Post
          </button>
        </section>

        <!-- Cards section -->
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>

        <!-- Card template -->
        <template id="card-template">
          <li class="card">
            <img class="card__image" src="" alt="" />
            <h2 class="card__title"></h2>
            <button type="button" class="card__like-button"></button>
            <button type="button" class="card__delete-button"></button>
          </li>
        </template>

        <!-- Footer -->
        <footer class="footer page__section">
          <p class="footer__copyright">2026 © Spots</p>
        </footer>
      </main>

      <!-- Edit profile modal -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/close-icon.svg" alt="Close" />
          </button>

          <h2 class="modal__title">Edit profile</h2>

          <form class="modal__form" name="edit-profile">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
              />
            </label>

            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
              />
            </label>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- New post modal -->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/close-icon.svg" alt="Close" />
          </button>

          <h2 class="modal__title">New post</h2>

          <form class="modal__form" name="new-post">
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
              />
            </label>

            <label for="image-caption-input" class="modal__label">
              Caption
              <input
                id="image-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
              />
            </label>

            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>

      <!-- Preview Image Modal -->
      <div class="modal" id="preview-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="./images/close-icon.svg" alt="Close" />
          </button>

          <img class="modal__image" src="" alt="" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <script src="./scripts/index.js"></script>
    </div>
  </body>
</html>
